<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Conversor de Skins - LoL</title>
<style>
  body { font-family: system-ui, sans-serif; background: #14161b; color: #e6e6e6;
         max-width: 760px; margin: 32px auto; padding: 0 16px; }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  .sub { color: #9aa0a6; margin-top: 0; }
  form { display: grid; grid-template-columns: 160px 1fr; gap: 12px 16px; align-items: center;
         background: #1d2027; padding: 20px; border-radius: 10px; }
  label { color: #c5c8cc; }
  input[type=text], input[type=number] { background: #11131a; color: #e6e6e6; border: 1px solid #333;
         border-radius: 6px; padding: 6px 8px; }
  .linha { display: flex; gap: 10px; align-items: center; }
  .dica { color: #7d838a; font-size: 0.85rem; }
  button { grid-column: 1 / -1; padding: 10px; font-size: 1rem; border: 0; border-radius: 8px;
           background: #3b82f6; color: white; cursor: pointer; }
  button:disabled { background: #444; cursor: wait; }
  .previa { display: flex; gap: 16px; justify-content: center; margin-top: 20px; }
  .previa figure { margin: 0; text-align: center; }
  .previa img { background: #0c0d10; border-radius: 6px; max-width: 260px; }
  pre { background: #0c0d10; padding: 12px; border-radius: 8px; white-space: pre-wrap; font-size: 0.85rem; }
  .erro { color: #ff7b72; }
  .baixar { display: inline-block; margin-top: 12px; padding: 8px 14px; background: #22c55e;
            color: #0b1a10; border-radius: 6px; text-decoration: none; font-weight: 600; }
  .oculto { display: none; }
</style>
</head>
<body>
<h1>Conversor de Skins</h1>
<p class="sub">Escolha uma skin (.fantome ou o .wad.client do jogo) e a cor nova.</p>

<form id="formulario">
  <label for="arquivo">Arquivo</label>
  <input type="file" id="arquivo" name="arquivo" accept=".fantome,.client" required>

  <label for="skin" id="rotulo-skin" class="oculto">Skin nº</label>
  <div id="linha-skin" class="linha oculto">
    <input type="number" id="skin" name="skin" value="0" min="0" max="99" style="width:70px">
    <span class="dica">0 = skin base</span>
  </div>

  <label for="cor-texto">Cor</label>
  <div class="linha">
    <input type="color" id="cor-seletor" value="#33cc55">
    <input type="text" id="cor-texto" name="cor" value="#33cc55" style="width:110px">
    <span class="dica">#hex, graus (0-360) ou nome: verde, roxo...</span>
  </div>

  <label for="variacao">Variação (degradê)</label>
  <div class="linha">
    <input type="range" id="variacao" name="variacao" min="-90" max="90" step="1"
           value="{{ padrao['variacao'] }}">
    <span id="valor-variacao"></span>
  </div>

  <label for="reforco">Intensidade da cor</label>
  <div class="linha">
    <input type="range" id="reforco" name="reforco" min="0.5" max="2" step="0.05"
           value="{{ padrao['reforco_saturacao'] }}">
    <span id="valor-reforco"></span>
  </div>

  <label for="nome">Nome do mod</label>
  <input type="text" id="nome" name="nome" placeholder="(opcional)">

  <button type="submit" id="botao">Gerar skin</button>
</form>

<div class="previa oculto" id="previa">
  <figure><img id="img-antes"><figcaption>Antes</figcaption></figure>
  <figure><img id="img-depois"><figcaption>Depois</figcaption></figure>
</div>
<div id="resultado"></div>
<pre id="log" class="oculto"></pre>

<script>
const $ = (id) => document.getElementById(id);

// mostra o campo "Skin nº" só para o WAD do jogo
$("arquivo").addEventListener("change", () => {
  const ehWad = $("arquivo").files[0]?.name.toLowerCase().endsWith(".wad.client");
  $("rotulo-skin").classList.toggle("oculto", !ehWad);
  $("linha-skin").classList.toggle("oculto", !ehWad);
});

// seletor de cor <-> campo de texto
$("cor-seletor").addEventListener("input", () => $("cor-texto").value = $("cor-seletor").value);
$("cor-texto").addEventListener("input", () => {
  if (/^#?[0-9a-f]{6}$/i.test($("cor-texto").value)) {
    $("cor-seletor").value = "#" + $("cor-texto").value.replace("#", "");
  }
});

// valores dos sliders
function mostrarSliders() {
  $("valor-variacao").textContent = $("variacao").value + "°";
  $("valor-reforco").textContent = Number($("reforco").value).toFixed(2) + "x";
}
$("variacao").addEventListener("input", mostrarSliders);
$("reforco").addEventListener("input", mostrarSliders);
mostrarSliders();

// enviar
$("formulario").addEventListener("submit", async (evento) => {
  evento.preventDefault();
  $("botao").disabled = true;
  $("botao").textContent = "Gerando... (o WAD do jogo pode demorar)";
  $("resultado").innerHTML = "";
  $("previa").classList.add("oculto");
  $("log").classList.add("oculto");

  try {
    const resposta = await fetch("/converter", { method: "POST", body: new FormData($("formulario")) });
    const dados = await resposta.json();
    if (dados.log) {
      $("log").textContent = dados.log;
      $("log").classList.remove("oculto");
    }
    if (!dados.ok) {
      $("resultado").innerHTML = `<p class="erro">Erro: ${dados.erro}</p>`;
      return;
    }
    if (dados.antes) {
      $("img-antes").src = dados.antes;
      $("img-depois").src = dados.depois;
      $("previa").classList.remove("oculto");
    }
    const link = document.createElement("a");
    link.className = "baixar";
    link.href = "/baixar/" + encodeURIComponent(dados.arquivo);
    link.textContent = "Baixar " + dados.arquivo;
    $("resultado").appendChild(link);
  } catch (erro) {
    $("resultado").innerHTML = `<p class="erro">Falha ao falar com o servidor: ${erro}</p>`;
  } finally {
    $("botao").disabled = false;
    $("botao").textContent = "Gerar skin";
  }
});
</script>
</body>
</html>
